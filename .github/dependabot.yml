version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      astro:
        patterns:
          - "^astro"
          - "^@astrojs/"
      other-dependencies:
        patterns:
          - ".*"
        exclude-patterns:
          - "^astro"
          - "^@astrojs/"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - ".*"